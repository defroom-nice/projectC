<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5eee2">
  <title>五子棋 · 松间对弈</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #342d26;
      --muted: #8a7b69;
      --green: #49664f;
      --green-dark: #354c3a;
      --paper: #fbf8f2;
      --line: #e9dfd0;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 10% 12%, rgba(220, 202, 166, .2), transparent 32%),
        radial-gradient(ellipse at 92% 84%, rgba(176, 195, 164, .2), transparent 30%),
        #f5eee2;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }

    button { font: inherit; }

    .page {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 38px 0 32px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 26px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .brand-mark {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 1px solid rgba(73, 102, 79, .18);
      border-radius: 15px;
      color: var(--green);
      background: rgba(255, 255, 255, .57);
      font-size: 23px;
    }

    .brand-name {
      margin: 0;
      font-family: "STSong", "Songti SC", serif;
      font-size: 21px;
      font-weight: 600;
      letter-spacing: .12em;
    }

    .brand-caption {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .16em;
    }

    .top-note {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .08em;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 286px;
      align-items: center;
      gap: 30px;
    }

    .board-frame {
      position: relative;
      width: 100%;
      padding: 13px;
      overflow: hidden;
      border: 1px solid rgba(119, 90, 51, .16);
      border-radius: 20px;
      background: rgba(255, 255, 255, .56);
      box-shadow: 0 18px 48px rgba(78, 60, 38, .11), 0 2px 6px rgba(78, 60, 38, .05);
    }

    #board {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 11px;
      touch-action: manipulation;
      cursor: pointer;
    }

    .side-panel {
      padding: 24px 21px 20px;
      border: 1px solid rgba(119, 90, 51, .12);
      border-radius: 19px;
      background: rgba(255, 255, 255, .68);
      box-shadow: 0 14px 36px rgba(78, 60, 38, .07);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #a18a69;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .2em;
    }

    h1 {
      margin: 0;
      font-family: "STSong", "Songti SC", serif;
      font-size: 27px;
      font-weight: 500;
      letter-spacing: .08em;
    }

    .intro {
      margin: 8px 0 21px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
    }

    .turn-card {
      display: flex;
      align-items: center;
      gap: 11px;
      min-height: 63px;
      margin-bottom: 18px;
      padding: 12px 13px;
      border: 1px solid #e8e1d5;
      border-radius: 12px;
      background: #f8f5ee;
    }

    .turn-stone {
      width: 25px;
      height: 25px;
      flex: 0 0 25px;
      border-radius: 50%;
      background: radial-gradient(circle at 34% 27%, #777, #252525 72%);
      box-shadow: 0 2px 4px rgba(0, 0, 0, .2);
    }

    .turn-stone.white {
      border: 1px solid #d5cdbf;
      background: radial-gradient(circle at 34% 27%, #fff, #e5dfd4 80%);
    }

    .turn-label {
      color: #998b79;
      font-size: 10px;
      letter-spacing: .12em;
    }

    .turn-message {
      margin-top: 3px;
      font-size: 13px;
      font-weight: 600;
    }

    .score-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .score {
      padding: 12px 13px;
      border: 1px solid #eee7dc;
      border-radius: 11px;
      background: rgba(255, 255, 255, .7);
    }

    .score-title {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 10px;
    }

    .score-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #302f2c;
    }

    .score-dot.white { border: 1px solid #c6bdaF; background: #f7f4ed; }
    .score-value { margin-top: 5px; font-size: 22px; font-weight: 600; }

    .actions { display: grid; gap: 9px; }

    .button {
      display: flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid #e4ddd2;
      border-radius: 10px;
      color: #594f43;
      background: #fffdf9;
      cursor: pointer;
      font-size: 12px;
      transition: transform .15s, background .15s, border-color .15s;
    }

    .button:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: #c9d2c4;
      background: #f7f9f4;
    }

    .button:active:not(:disabled) { transform: translateY(0); }
    .button:disabled { cursor: not-allowed; opacity: .48; }

    .button.primary {
      border-color: var(--green);
      color: white;
      background: var(--green);
    }

    .button.primary:hover:not(:disabled) {
      border-color: var(--green-dark);
      background: var(--green-dark);
    }

    .button.music-on {
      border-color: #b9c9b8;
      color: var(--green-dark);
      background: #f1f6ef;
    }

    .divider { height: 1px; margin: 19px 0 14px; background: #eee7dc; }

    .rules {
      color: #948675;
      font-size: 10px;
      line-height: 1.9;
    }

    .rules strong { color: #6e6254; font-weight: 600; }

    .footer {
      margin-top: 18px;
      color: #a69783;
      font-size: 10px;
      letter-spacing: .08em;
      text-align: center;
    }

    @media (max-width: 820px) {
      .page { width: min(620px, calc(100% - 28px)); padding-top: 23px; }
      .layout { grid-template-columns: 1fr; gap: 17px; }
      .side-panel { padding: 20px; }
      .topbar { margin-bottom: 17px; }
      .top-note { display: none; }
      .intro { margin-bottom: 13px; }
      .turn-card { margin-bottom: 12px; }
      .score-row { margin-bottom: 13px; }
      .actions { grid-template-columns: 1fr 1fr; }
      .actions .primary { grid-column: 1 / -1; }
      .divider, .rules { display: none; }
      .footer { margin-top: 12px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">弈</div>
        <div>
          <p class="brand-name">松间对弈</p>
          <p class="brand-caption">A QUIET GAME OF GOMOKU</p>
        </div>
      </div>
      <div class="top-note">静心落子 · 五子连珠</div>
    </header>

    <section class="layout" aria-label="五子棋游戏">
      <div class="board-frame">
        <canvas id="board" width="720" height="720" aria-label="五子棋棋盘，点击交叉点落子"></canvas>
      </div>

      <aside class="side-panel">
        <p class="eyebrow">GOMOKU · 15 × 15</p>
        <h1>五子棋</h1>
        <p class="intro">黑子先行，与电脑来一场安静的对弈。<br>率先连成五子的一方获胜。</p>

        <div class="turn-card" aria-live="polite">
          <div class="turn-stone" id="turn-stone"></div>
          <div>
            <div class="turn-label">当前回合</div>
            <div class="turn-message" id="status">轮到你落子</div>
          </div>
        </div>

        <div class="score-row" aria-label="回合数">
          <div class="score">
            <div class="score-title"><span class="score-dot"></span>你 · 黑棋</div>
            <div class="score-value" id="player-count">0</div>
          </div>
          <div class="score">
            <div class="score-title"><span class="score-dot white"></span>电脑 · 白棋</div>
            <div class="score-value" id="computer-count">0</div>
          </div>
        </div>

        <div class="actions">
          <button class="button primary" id="restart">↻　重新开始</button>
          <button class="button" id="undo">↶　悔棋</button>
          <button class="button" id="music" aria-pressed="false">♫　开启背景音乐</button>
        </div>

        <div class="divider"></div>
        <div class="rules"><strong>小提示</strong><br>点击棋盘交叉点落子。悔棋会撤回你和电脑最近的一轮。背景音乐由浏览器实时生成，不需要额外下载音频文件。</div>
      </aside>
    </section>
    <footer class="footer">愿每一手，都落在恰好的地方</footer>
  </main>

  <script>
    (() => {
      "use strict";

      const SIZE = 15;
      const EMPTY = 0;
      const BLACK = 1;
      const WHITE = 2;
      const BOARD_SIZE = 720;
      const EDGE = 48;
      const STEP = (BOARD_SIZE - EDGE * 2) / (SIZE - 1);
      const DIRECTIONS = [[1, 0], [0, 1], [1, 1], [1, -1]];
      const canvas = document.getElementById("board");
      const ctx = canvas.getContext("2d");
      const statusText = document.getElementById("status");
      const turnStone = document.getElementById("turn-stone");
      const undoButton = document.getElementById("undo");
      const musicButton = document.getElementById("music");
      const grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(EMPTY));
      const history = [];
      let currentPlayer = BLACK;
      let thinking = false;
      let gameOver = false;
      let winningLine = [];
      let lastMove = null;
      let aiTimer = null;
      let audioContext = null;
      let musicTimer = null;
      let musicPlaying = false;
      let audioStarting = false;
      let noteIndex = 0;

      function drawBoard() {
        const wood = ctx.createLinearGradient(0, 0, BOARD_SIZE, BOARD_SIZE);
        wood.addColorStop(0, "#e8c98e");
        wood.addColorStop(.48, "#dfbd7d");
        wood.addColorStop(1, "#d4ae6f");
        ctx.fillStyle = wood;
        ctx.fillRect(0, 0, BOARD_SIZE, BOARD_SIZE);

        for (let i = 0; i < 30; i++) {
          const y = 18 + i * 24;
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.bezierCurveTo(180, y + Math.sin(i * 1.7) * 5, 490, y - Math.cos(i) * 5, BOARD_SIZE, y + Math.sin(i) * 3);
          ctx.strokeStyle = i % 3 === 0 ? "rgba(130, 91, 39, .075)" : "rgba(255, 246, 218, .075)";
          ctx.lineWidth = i % 3 === 0 ? 1.2 : .8;
          ctx.stroke();
        }

        ctx.strokeStyle = "rgba(78, 57, 34, .78)";
        ctx.lineWidth = 1.25;
        for (let i = 0; i < SIZE; i++) {
          const p = EDGE + i * STEP;
          ctx.beginPath();
          ctx.moveTo(EDGE, p);
          ctx.lineTo(BOARD_SIZE - EDGE, p);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(p, EDGE);
          ctx.lineTo(p, BOARD_SIZE - EDGE);
          ctx.stroke();
        }

        [3, 7, 11].forEach((row) => {
          [3, 7, 11].forEach((col) => {
            ctx.beginPath();
            ctx.arc(EDGE + col * STEP, EDGE + row * STEP, 3.2, 0, Math.PI * 2);
            ctx.fillStyle = "#59452c";
            ctx.fill();
          });
        });

        for (let row = 0; row < SIZE; row++) {
          for (let col = 0; col < SIZE; col++) {
            if (grid[row][col] !== EMPTY) drawStone(row, col, grid[row][col]);
          }
        }

        if (lastMove) {
          const x = EDGE + lastMove.col * STEP;
          const y = EDGE + lastMove.row * STEP;
          ctx.beginPath();
          ctx.arc(x, y, 3.2, 0, Math.PI * 2);
          ctx.fillStyle = lastMove.player === BLACK ? "#f5eee2" : "#776448";
          ctx.fill();
        }

        winningLine.forEach(({ row, col }) => {
          const x = EDGE + col * STEP;
          const y = EDGE + row * STEP;
          ctx.beginPath();
          ctx.arc(x, y, 12, 0, Math.PI * 2);
          ctx.strokeStyle = "#d46d45";
          ctx.lineWidth = 2.5;
          ctx.stroke();
        });
      }

      function drawStone(row, col, player) {
        const x = EDGE + col * STEP;
        const y = EDGE + row * STEP;
        const radius = STEP * .43;
        ctx.save();
        ctx.shadowColor = "rgba(55, 39, 20, .28)";
        ctx.shadowBlur = 7;
        ctx.shadowOffsetY = 3;
        const gradient = ctx.createRadialGradient(
          x - radius * .34, y - radius * .4, radius * .08,
          x, y, radius
        );
        if (player === BLACK) {
          gradient.addColorStop(0, "#62615d");
          gradient.addColorStop(.35, "#292a29");
          gradient.addColorStop(1, "#111211");
        } else {
          gradient.addColorStop(0, "#fffefa");
          gradient.addColorStop(.72, "#f1ede4");
          gradient.addColorStop(1, "#d5cebf");
        }
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();
        ctx.restore();
      }

      function updatePanel() {
        let blackCount = 0;
        let whiteCount = 0;
        history.forEach((move) => {
          if (move.player === BLACK) blackCount++;
          else whiteCount++;
        });
        document.getElementById("player-count").textContent = blackCount;
        document.getElementById("computer-count").textContent = whiteCount;
        undoButton.disabled = history.length === 0 || thinking;
        turnStone.classList.toggle("white", currentPlayer === WHITE);
      }

      function setStatus(message) {
        statusText.textContent = message;
      }

      function placeStone(row, col, player) {
        grid[row][col] = player;
        const move = { row, col, player };
        history.push(move);
        lastMove = move;
        winningLine = findWinningLine(row, col, player);
        drawBoard();
        updatePanel();
        if (winningLine.length) {
          gameOver = true;
          setStatus(player === BLACK ? "恭喜你，赢了！" : "电脑获胜，再来一局？");
          return true;
        }
        if (history.length === SIZE * SIZE) {
          gameOver = true;
          setStatus("棋盘已满，平局！");
          return true;
        }
        return false;
      }

      function findWinningLine(row, col, player) {
        for (const [dx, dy] of DIRECTIONS) {
          const line = [{ row, col }];
          for (const sign of [-1, 1]) {
            let x = col + dx * sign;
            let y = row + dy * sign;
            while (x >= 0 && x < SIZE && y >= 0 && y < SIZE && grid[y][x] === player) {
              if (sign < 0) line.unshift({ row: y, col: x });
              else line.push({ row: y, col: x });
              x += dx * sign;
              y += dy * sign;
            }
          }
          if (line.length >= 5) return line;
        }
        return [];
      }

      function evaluateMove(row, col, player) {
        let total = 0;
        for (const [dx, dy] of DIRECTIONS) {
          let count = 1;
          let openEnds = 0;
          for (const sign of [-1, 1]) {
            let x = col + dx * sign;
            let y = row + dy * sign;
            let steps = 0;
            while (x >= 0 && x < SIZE && y >= 0 && y < SIZE && grid[y][x] === player && steps < 4) {
              count++;
              steps++;
              x += dx * sign;
              y += dy * sign;
            }
            if (x >= 0 && x < SIZE && y >= 0 && y < SIZE && grid[y][x] === EMPTY) openEnds++;
          }
          if (count >= 5) total += 10000000;
          else if (count === 4 && openEnds === 2) total += 1200000;
          else if (count === 4 && openEnds === 1) total += 180000;
          else if (count === 3 && openEnds === 2) total += 30000;
          else if (count === 3 && openEnds === 1) total += 4500;
          else if (count === 2 && openEnds === 2) total += 900;
          else if (count === 2 && openEnds === 1) total += 120;
          else if (count === 1 && openEnds === 2) total += 12;
        }
        return total;
      }

      function chooseComputerMove() {
        let bestMove = null;
        let bestScore = -Infinity;
        for (let row = 0; row < SIZE; row++) {
          for (let col = 0; col < SIZE; col++) {
            if (grid[row][col] !== EMPTY) continue;
            const nearby = hasNeighbor(row, col);
            if (history.length > 0 && !nearby) continue;
            const attack = evaluateMove(row, col, WHITE);
            const defense = evaluateMove(row, col, BLACK);
            const centerBonus = 14 - Math.abs(7 - row) - Math.abs(7 - col);
            const score = Math.max(attack, defense * 1.08) + attack * .12 + centerBonus;
            if (score > bestScore) {
              bestScore = score;
              bestMove = { row, col };
            }
          }
        }
        return bestMove || { row: 7, col: 7 };
      }

      function hasNeighbor(row, col) {
        for (let y = Math.max(0, row - 2); y <= Math.min(SIZE - 1, row + 2); y++) {
          for (let x = Math.max(0, col - 2); x <= Math.min(SIZE - 1, col + 2); x++) {
            if (grid[y][x] !== EMPTY) return true;
          }
        }
        return false;
      }

      function handleBoardClick(event) {
        if (gameOver || thinking || currentPlayer !== BLACK) return;
        const rect = canvas.getBoundingClientRect();
        const x = (event.clientX - rect.left) * BOARD_SIZE / rect.width;
        const y = (event.clientY - rect.top) * BOARD_SIZE / rect.height;
        const col = Math.round((x - EDGE) / STEP);
        const row = Math.round((y - EDGE) / STEP);
        if (row < 0 || row >= SIZE || col < 0 || col >= SIZE) return;
        if (Math.hypot(x - (EDGE + col * STEP), y - (EDGE + row * STEP)) > STEP * .48) return;
        if (grid[row][col] !== EMPTY) return;

        if (placeStone(row, col, BLACK)) return;
        currentPlayer = WHITE;
        thinking = true;
        setStatus("电脑思考中…");
        updatePanel();
        aiTimer = window.setTimeout(() => {
          aiTimer = null;
          const move = chooseComputerMove();
          if (!move) {
            gameOver = true;
            setStatus("棋盘已满，平局！");
          } else if (!placeStone(move.row, move.col, WHITE)) {
            currentPlayer = BLACK;
            setStatus("轮到你落子");
          }
          thinking = false;
          updatePanel();
        }, 320);
      }

      function undoTurn() {
        if (!history.length || thinking) return;
        const last = history[history.length - 1];
        history.pop();
        grid[last.row][last.col] = EMPTY;
        if (last.player === WHITE && history.length) {
          const playerMove = history.pop();
          grid[playerMove.row][playerMove.col] = EMPTY;
        }
        gameOver = false;
        winningLine = [];
        lastMove = history.length ? history[history.length - 1] : null;
        currentPlayer = BLACK;
        setStatus("轮到你落子");
        drawBoard();
        updatePanel();
      }

      function restartGame() {
        if (aiTimer !== null) {
          window.clearTimeout(aiTimer);
          aiTimer = null;
        }
        for (let row = 0; row < SIZE; row++) grid[row].fill(EMPTY);
        history.length = 0;
        currentPlayer = BLACK;
        thinking = false;
        gameOver = false;
        winningLine = [];
        lastMove = null;
        setStatus("轮到你落子");
        drawBoard();
        updatePanel();
      }

      const melody = [392, 440, 523.25, 440, 349.23, 392, 440, 392, 329.63, 392, 440, 523.25, 493.88, 440, 392, 349.23];

      function playNote(frequency, start, duration, volume, type) {
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, start);
        gain.gain.setValueAtTime(.0001, start);
        gain.gain.exponentialRampToValueAtTime(volume, start + .08);
        gain.gain.exponentialRampToValueAtTime(.0001, start + duration);
        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        oscillator.start(start);
        oscillator.stop(start + duration + .03);
      }

      function scheduleMusicNote() {
        if (!musicPlaying || !audioContext) return;
        const now = audioContext.currentTime;
        const frequency = melody[noteIndex % melody.length];
        const duration = noteIndex % 4 === 3 ? .68 : .52;
        playNote(frequency, now, duration, .035, "sine");
        if (noteIndex % 4 === 0) playNote(frequency / 2, now, 1.4, .012, "triangle");
        noteIndex++;
      }

      async function toggleMusic() {
        if (audioStarting) return;
        audioStarting = true;
        musicButton.disabled = true;
        try {
          if (musicPlaying) {
            musicPlaying = false;
            window.clearInterval(musicTimer);
            if (audioContext) await audioContext.suspend();
            musicButton.textContent = "♫　开启背景音乐";
            musicButton.classList.remove("music-on");
            musicButton.setAttribute("aria-pressed", "false");
          } else {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) {
              setStatus("当前浏览器不支持背景音乐");
              return;
            }
            if (!audioContext) audioContext = new AudioContextClass();
            if (audioContext.state === "suspended") await audioContext.resume();
            musicPlaying = true;
            noteIndex = 0;
            scheduleMusicNote();
            musicTimer = window.setInterval(scheduleMusicNote, 620);
            musicButton.textContent = "♫　关闭背景音乐";
            musicButton.classList.add("music-on");
            musicButton.setAttribute("aria-pressed", "true");
          }
        } catch (error) {
          musicPlaying = false;
          window.clearInterval(musicTimer);
          musicButton.textContent = "♫　开启背景音乐";
          musicButton.classList.remove("music-on");
          musicButton.setAttribute("aria-pressed", "false");
          setStatus("背景音乐无法播放：" + error.message);
        } finally {
          audioStarting = false;
          musicButton.disabled = false;
        }
      }

      canvas.addEventListener("click", handleBoardClick);
      document.getElementById("restart").addEventListener("click", restartGame);
      undoButton.addEventListener("click", undoTurn);
      musicButton.addEventListener("click", toggleMusic);
      drawBoard();
      updatePanel();
    })();
  </script>
</body>
</html>
